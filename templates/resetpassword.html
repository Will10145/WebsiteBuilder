<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="{{ styles }}" />
  </head>

  <body
    class="bg-gradient-to-br from-indigo-500 via-green-500 to-dark-green-500 min-h-screen flex items-center justify-center"
  >
    <div
      class="bg-white/90 backdrop-blur-lg shadow-2xl rounded-2xl w-full max-w-sm p-8"
    >
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
        Reset Password
      </h1>
      {% if success %}
      <h1 class="text-3xl font-bold text-center text-green-800 mb-6">
        Success! Please check your inbox!
      </h1>
      <a href="/login" class="font-medium text-fg-brand hover:underline"
        >Log in</a
      >
      {% else %}
      <form action="/resetpassword" method="post" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Email</label
          >
          <input
            type="email"
            name="email"
            required
            autocomplete="email"
            placeholder="bob@willcodes.tech"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        {{ turnstile }} {% if error %}
        <p class="text-red-500 text-sm text-center">{{ error }}</p>
        {% endif %}

        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition"
        >
          Send Email
        </button>
        <a href="/login" class="font-medium text-fg-brand hover:underline"
          >Log in</a
        >
        <a> • </a>
        <a href="/signup" class="font-medium text-fg-brand hover:underline"
          >Sign up</a
        >
      </form>
      {% endif %}
    </div>
  </body>
</html>
